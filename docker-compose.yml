# Base de datos local. El nombre del proyecto es fijo para que el contenedor y el
# volumen (booking-vuelos_pgdata) sean los mismos sin importar la carpeta del clon.
name: booking-vuelos

services:
  postgres:
    image: postgres:18
    container_name: booking_db_container
    ports:
      # El puerto del host se cambia con DB_PORT en .env (compose lo lee solo).
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # Desde la imagen 18 los datos viven en /var/lib/postgresql/<versión>/docker.
      # Se monta el directorio padre; con /var/lib/postgresql/data el contenedor no arranca.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d booking_db']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
