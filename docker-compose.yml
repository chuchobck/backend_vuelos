services:
  postgres:
    image: postgres:16
    container_name: booking_db_container
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
