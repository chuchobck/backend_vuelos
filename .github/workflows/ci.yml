# Integración continua: en cada push y pull request a main, una base PostgreSQL 18 nueva con los
# esquemas y las semillas de db/, y luego lint, formato, compilación y la suite e2e completa.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: lint, build y pruebas e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: booking_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_db?schema=vuelos
      NODE_ENV: test
      PORT: '3000'
      # Valores falsos, solo para CI: no son los de ningún entorno ni secretos del repositorio
      JWT_SECRET: ci-solo-pruebas-jwt-0123456789abcdefghijklmnop
      WEBHOOK_SECRET_KEY: ci-solo-pruebas-webhooks-0123456789abcdefghij
      # gRPC apagado, como en Render: las pruebas de gRPC lo encienden con su propio puerto
      GRPC_ENABLED: 'false'
      # Autenticación local, como en Render. La suite de AUTH_MODE=external fija su propio
      # AUTH_MODE, JWT_ISSUER y JWT_AUDIENCE contra un servicio de identidad falso
      AUTH_MODE: local
      # Webhooks repartidos por el core, como en Render. La suite de WEBHOOKS_MODE=notifier fija
      # sus propias variables contra un notifier y un identity falsos
      WEBHOOKS_MODE: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dependencias (y cliente de Prisma)
        run: npm ci

      # Los mismos archivos y el mismo orden que db/reset.sh, con el psql 18 del contenedor.
      # Sin hash_admin, semilla_seguridad.sql crea los roles y no el administrador.
      - name: Esquemas y semillas
        env:
          CONTENEDOR: ${{ job.services.postgres.id }}
        run: |
          for archivo in esquema_vuelos esquema_seguridad semilla_vuelos semilla_seguridad; do
            echo "Cargando db/${archivo}.sql"
            docker exec -i "$CONTENEDOR" psql -U postgres -d booking_db -v ON_ERROR_STOP=1 -q < "db/${archivo}.sql"
          done

      # Una base que ya existe (esquema de main + db/migraciones) tiene que quedar igual a una nueva
      # (db/esquema_vuelos.sql de este árbol): pg_dump -s de las dos, comparados. Las migraciones se
      # aplican dos veces para comprobar que son idempotentes.
      - name: Base migrada = base nueva
        env:
          CONTENEDOR: ${{ job.services.postgres.id }}
        run: |
          git fetch --no-tags --depth=1 origin main
          scripts/comprobar-migraciones.sh FETCH_HEAD

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Compilación
        run: npm run build

      # Contrato gRPC: estilo (buf lint y buf format) y compatibilidad hacia atrás con el de main
      # (buf breaking con las reglas de buf.yaml). El clon de actions/checkout no trae main.
      - name: Contrato gRPC
        run: |
          git fetch --no-tags --depth=1 origin main
          npm run proto:lint
          npm run proto:breaking -- FETCH_HEAD

      - name: Pruebas e2e
        run: npm run test:e2e

  eventos:
    name: esquemas de eventos del notifier (informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Informa si la copia de contracts/notifier-eventos se quedó atrás del notifier; no bloquea
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Comparar con main del notifier
        run: npm run eventos:check
